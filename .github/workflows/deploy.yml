name: Deploy to GCS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          CI: false

      - name: Verify build
        run: |
          echo "=== BUILD CONTENTS ==="
          find build -type f
          echo ""
          echo "=== INDEX.HTML ==="
          cat build/index.html

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to GCS
        run: |
          gcloud storage rsync build gs://${{ secrets.GCS_BUCKET_NAME }} --recursive --delete-unmatched-destination-objects

      - name: Verify GCS files
        run: |
          echo "=== FILES IN BUCKET ==="
          gcloud storage ls --recursive gs://${{ secrets.GCS_BUCKET_NAME }}
